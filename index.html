    <title>Kavach — Anti-Stalking Shield</title>
    <!-- Reset any stale dark-mode preference from previous builds -->
    <script>
      (function() {
        // Kavach v1.1: light-mode-first. Remove legacy neon-dark flag.
        var stored = localStorage.getItem('kavach-theme');
        // Only honour the stored value if it was set by the new build
        // (new build stores 'light' explicitly; old build never stored 'light')
        if (stored === null || stored === 'dark' && !localStorage.getItem('kavach-v11')) {
          localStorage.removeItem('kavach-theme');
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('kavach-v11', '1');
      })();
    </script>
